</head>
<body>
  <div class="layout">
    <aside class="list-pane">
      <header class="bar">
        <div class="bar-title">
          <strong>YouTube Digest</strong>
          <span id="status" class="muted" aria-live="polite"></span>
        </div>
        <button id="refresh" type="button" class="btn-secondary" title="Check the subscriptions feed now">Check now</button>
      </header>
      <div role="tablist" aria-label="Video lists" class="filters">
        <button role="tab" id="f-done" aria-selected="true" aria-controls="items" data-filter="done">Summaries <span class="count" id="c-done"></span></button>
        <button role="tab" id="f-queue" aria-selected="false" aria-controls="items" data-filter="queue" tabindex="-1">Queue <span class="count" id="c-queue"></span></button>
        <button role="tab" id="f-skipped" aria-selected="false" aria-controls="items" data-filter="skipped" tabindex="-1">Skipped <span class="count" id="c-skipped"></span></button>
      </div>
      <div id="items" role="tabpanel" aria-labelledby="f-done" class="items"></div>
      <details class="activity">
        <summary>Activity log</summary>
        <pre id="log"></pre>
      </details>
    </aside>
    <main class="report-pane" id="report-pane" hidden>
      <div class="report-head">
        <button id="back" type="button" class="btn-secondary back">← Back</button>
        <div id="report-hero"></div>
      </div>
      <article id="report" class="md"></article>
    </main>
    <div class="empty-pane" id="empty-pane">Select a summary to read it.</div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
