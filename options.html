<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Summarizer Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h2>AI Provider</h2>
    <div class="setting-group">
      <label for="providerSelect">Select default AI provider:</label>
      <select id="providerSelect">
        <option value="antigravity">Antigravity (AGY Session)</option>
        <option value="claude">Claude</option>
        <option value="deepseek">DeepSeek</option>
        <option value="chatgpt">ChatGPT</option>
        <option value="gemini">Gemini</option>
        <option value="aistudio">AI Studio</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="agyModelSelect">Antigravity Model:</label>
      <select id="agyModelSelect">
        <option value="hydrogen">Gemini 4 Hydrogen (High) — Default</option>
        <option value="hydrogen_xhigh">Gemini 4 Hydrogen (XHigh)</option>
        <option value="hydrogen_medium">Gemini 4 Hydrogen (Medium)</option>
        <option value="hydrogen_low">Gemini 4 Hydrogen (Low)</option>
        <option value="flash_high">Gemini 3.8 Flash (High)</option>
        <option value="flash_medium">Gemini 3.8 Flash (Medium)</option>
        <option value="flash_lite">Gemini 3.8 Flash (Low)</option>
      </select>
    </div>

    <button id="resetBtn">Reset to Defaults</button>
    <p id="status"></p>

    <script src="options.js"></script>
  </body>
</html>
