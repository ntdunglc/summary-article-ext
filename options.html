<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Summarizer Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h2>AI Provider</h2>
    <div class="setting-group">
      <label for="providerSelect">Select default AI provider:</label>
      <select id="providerSelect">
        <option value="antigravity">Antigravity (AGY Session)</option>
        <option value="claude">Claude</option>
        <option value="deepseek">DeepSeek</option>
        <option value="chatgpt">ChatGPT</option>
        <option value="gemini">Gemini</option>
        <option value="aistudio">AI Studio</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="agyModelSelect">Antigravity Model:</label>
      <select id="agyModelSelect">
        <option value="MODEL_PLACEHOLDER_M532">Gemini 4 Neon (High) — Default</option>
        <option value="MODEL_PLACEHOLDER_M535">Gemini 4 Neon (XHigh)</option>
        <option value="MODEL_PLACEHOLDER_M533">Gemini 4 Neon (Medium)</option>
        <option value="MODEL_PLACEHOLDER_M534">Gemini 4 Neon (Low)</option>
        <option value="MODEL_PLACEHOLDER_M525">Gemini 4 Hydrogen (High)</option>
        <option value="MODEL_PLACEHOLDER_M528">Gemini 4 Hydrogen (XHigh)</option>
        <option value="MODEL_PLACEHOLDER_M526">Gemini 4 Hydrogen (Medium)</option>
        <option value="MODEL_PLACEHOLDER_M527">Gemini 4 Hydrogen (Low)</option>
        <option value="MODEL_PLACEHOLDER_M318">Gemini 3.8 Flash (High)</option>
        <option value="MODEL_PLACEHOLDER_M319">Gemini 3.8 Flash (Medium)</option>
        <option value="MODEL_PLACEHOLDER_M320">Gemini 3.8 Flash (Low)</option>
      </select>
    </div>

    <button id="resetBtn">Reset to Defaults</button>
    <p id="status"></p>

    <script src="options.js"></script>
  </body>
</html>
